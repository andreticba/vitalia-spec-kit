# agents_catalog.yaml | Vitalia SPEC Kit v0.0.1 | 08-11-2026 19:50(GMT-04:00)
# Catálogo completo dos agentes especialistas do ecossistema Vitalia SPEC Kit (FR-009)

schema_type:    "agents_catalog"
schema_version: "0.0.1"
description:    "Catálogo completo dos agentes especialistas do ecossistema Vitalia SPEC Kit"

agents:
  # Sub-Agente SDD Constitutional Judge (status: active)
  - id:          "sdd-judge"
    name:        "SDD Constitutional Judge"
    emoji:       "⚖️"
    status:      "active"
    gates:       ["specify", "plan", "tasks", "converge"]
    command:     "/vitalia-judge"
    role:        "Auditoria constitucional adversarial e guardrail do pipeline SDD"
    model_hint:  "frontier"
    sub_agents: []
    data_inputs:
      - type:    "feature_graph"
    data_outputs:
      - type:    "inspection_report"
        format:  "markdown"
        path:    "specs/{feature}/Relatório de Inspeção - {phase}.md"
    hitl_required: true
    description: |
      Auditor adversarial de primeira classe nativo na IDE Antigravity.
      Executa inspeção constitucional massiva contra P00 a P17 via Sanduíche Constitucional,
      Inverted Chain-of-Thought, FMEA Mental e Matriz de Confronto 1-a-1, emitindo relatório físico
      com pausa mandatória para aprovação humana soberana.

  # Sub-Agente Vitalia Researcher — Grounding de Fronteira e Contratos (status: active)
  - id:          "research"
    name:        "Vitalia Researcher (Grounding & Contract Verifier)"
    emoji:       "🔬"
    status:      "active"
    gates:       ["brainstorming", "specify", "plan", "route"]
    command:     "/vitalia-research"
    role:        "Pesquisa externa com validação HTTP 200, leitura integral de páginas, checagem de depreciação temporal e análise de contrato do consumidor"
    model_hint:  "frontier"
    sub_agents:
      - "vitalia-researcher"
    data_inputs:
      - type:    "research_query_and_components"
    data_outputs:
      - type:    "grounding_report"
        format:  "markdown"
        path:    "specs/{feature}/research.md"
    hitl_required: false
    description: |
      Sub-Agente de pesquisa profunda e Grounding Temporal (P03) na Antigravity IDE.
      Opera via define_subagent ('vitalia-researcher') ou 'self' com acesso à rede (search_web + run_command)
      para validar URLs (HTTP 200), ler o conteúdo completo de documentações oficiais (evitando métodos
      depreciados), inspecionar contratos do cliente (Antigravity IDE) e executar Engenharia Reversa
      Funcional em 3 Camadas sobre componentes existentes.

  # Agente Arquiteto Soberano (status: active)
  - id:          "architect"
    name:        "Vitalia Architect"
    emoji:       "🏛️"
    status:      "active"
    gates:       ["route", "brainstorming", "session-end"]
    command:     "/vitalia-architect"
    role:        "Regência Arquitetural Soberana e transição de consensos para o pipeline SDD formal"
    model_hint:  "frontier"
    sub_agents: []
    data_inputs:
      - type:    "brainstorming_artifact"
        path:    "specs/{feature}/research-brainstorming.md"
    data_outputs:
      - type:    "architecture_governance"
        path:    "specs/{feature}/regencia-architect-plano-turno.md"
        format:  "markdown"
    hitl_required: true
    description: |
      Converte consensos do brainstorming em governança arquitetural soberana e specs formais do pipeline
      SDD (spec-specify → spec-plan → spec-tasks → spec-implement). Cria ADRs e
      documenta decisões arquiteturais.

  # Especialistas Verticais de Domínio / Workflows Planejados (status: planned)
  - id:          "medical-gate"
    name:        "Medical Gate"
    emoji:       "🩺"
    status:      "planned"
    gates:       ["route", "session-start", "session-end", "medical_gate"]
    command:     "/vitalia-medical-gate"
    role:        "Avaliação de risco clínico e HITL médico"
    model_hint:  "frontier"
    sub_agents: []
    data_inputs:
      - type:    "spec_content"
    data_outputs:
      - type:    "risk_report"
        format:  "markdown"
        status:  "DRAFT"
    hitl_required: true
    description: |
      Avalia risco clínico de specs e implementações, verifica faixas de referência
      de biomarcadores e garante friction-for-safety em decisões médicas.
      Todo output é DRAFT até aprovação de profissional de saúde.

  - id:          "design-thinking"
    name:        "Design Thinking Facilitator"
    emoji:       "🎨"
    status:      "planned"
    gates:       ["route", "session-start", "session-end"]
    command:     "/vitalia-design-thinking"
    role:        "Facilitador de workshops, PRDs e descoberta humana"
    model_hint:  "frontier"
    sub_agents:
      - "persona-builder"
      - "hmw-generator"
      - "csd-manager"
      - "prd-synthesizer"
    data_inputs:
      - type: "none"
    data_outputs:
      - type:    "artifact"
        path:    "docs/design/"
        format:  "markdown"
    description: |
      Conduz workshops de Design Thinking (Duplo Diamante), elabora PRDs executivos,
      mapas de empatia, declarações HMW e personas. Serve workshops acadêmicos na UFMT
      e modelagem de produtos para o ecossistema Vitalia.

  - id:          "literature-curator"
    name:        "Literature Curator"
    emoji:       "📚"
    status:      "planned"
    gates:       ["route", "session-start", "session-end"]
    command:     "/vitalia-literature-curator"
    role:        "Guardião do acervo e ingestão científica"
    model_hint:  "frontier"
    sub_agents:
      - "ncbi-fetcher"
      - "openalex-downloader"
      - "docling-converter"
      - "prisma-auditor"
    data_inputs:
      - type:    "directory"
        path:    ".vitalia/memory/data_storage/amostra/"
        watch:   true
      - type:    "directory"
        path:    ".vitalia/memory/data_storage/papers/"
    data_outputs:
      - type:    "pgvector"
        description: "Chunks indexados semanticamente"
      - type:    "directory"
        path:    ".vitalia/memory/data_storage/fichamentos/"
        format:  "markdown"
    description: |
      Coleta, baixa, extrai texto completo e indexa literatura científica via EuropePMC
      (XML), OpenAlex (PDF OA), e Docling da IBM para Markdown estruturado.
      Mantém rastreabilidade PRISMA 2020 e fila de download CAFe/CAPES.

  - id:          "visual-creator"
    name:        "Visual Creator"
    emoji:       "🖼️"
    status:      "planned"
    gates:       ["route", "session-end"]
    command:     "/vitalia-visual-creator"
    role:        "Geração visual híbrida e prototipação"
    model_hint:  "frontier"
    sub_agents:
      - "prompt-visual-optimizer"
      - "image-backend-router"
      - "artifact-embedder"
    data_inputs:
      - type:    "description"
    data_outputs:
      - type:    "directory"
        path:    ".vitalia/memory/data_storage/images/"
        format:  "webp|png"
    description: |
      Gera personas fotorrealistas, wireframes de Design Thinking e infográficos clínicos.
      Roteia automaticamente entre backend Gemini (qualidade) e Diffusers local (privacidade).

  # Especialistas do ecossistema AI-Control (FR-009 — status: planned)
  - id:          "master-ai-control"
    name:        "Master AI-Control"
    emoji:       "👑"
    status:      "planned"
    gates:       ["route", "session-start", "session-end"]
    command:     "/vitalia-master-ai-control"
    role:        "Arquiteto e Maestro do Projeto"
    model_hint:  "frontier"
    sub_agents: []
    description: |
      Arquiteto-chefe do ecossistema AI-Control. Orquestra requisitos cross-system,
      arbitra decisões técnicas e garante alinhamento estratégico da solução.

  - id:          "django-stark"
    name:        "Django-Stark"
    emoji:       "⚡"
    status:      "planned"
    gates:       ["route"]
    command:     "/vitalia-django-stark"
    role:        "Especialista Backend Python e Django"
    model_hint:  "frontier"
    sub_agents: []
    description: |
      Especialista em arquitetura backend, Django, Django REST Framework, Celery,
      Redis, modelagem relacional PostgreSQL, autenticação e performance de APIs.

  - id:          "react-vinci"
    name:        "React-Vinci"
    emoji:       "🎨"
    status:      "planned"
    gates:       ["route"]
    command:     "/vitalia-react-vinci"
    role:        "Especialista Frontend e UI"
    model_hint:  "frontier"
    sub_agents: []
    description: |
      Especialista em arquitetura frontend, Next.js, React, TypeScript, Tailwind CSS,
      gerenciamento de estado, acessibilidade e integração fluida com APIs backend.

  - id:          "infra-nomad"
    name:        "Infra-Nomad"
    emoji:       "🐳"
    status:      "planned"
    gates:       ["route"]
    command:     "/vitalia-infra-nomad"
    role:        "Especialista em DevOps e Infraestrutura"
    model_hint:  "frontier"
    sub_agents: []
    description: |
      Guardião da infraestrutura conteinerizada, Docker Compose, redes isoladas,
      volumes persistentes, variáveis de ambiente seguras e pipelines de CI/CD.

  - id:          "cortex-analyst"
    name:        "Cortex-Analyst"
    emoji:       "🧠"
    status:      "planned"
    gates:       ["route"]
    command:     "/vitalia-cortex-analyst"
    role:        "Especialista em Dados, IA e RAG"
    model_hint:  "frontier"
    sub_agents: []
    description: |
      Especialista em pipelines de ingestão de dados, chunking, modelos de embeddings
      locais/cloud, busca vetorial com pgvector e engenharia de contexto para LLMs.

  - id:          "figma-maestro"
    name:        "Figma-Maestro"
    emoji:       "✨"
    status:      "planned"
    gates:       ["route"]
    command:     "/vitalia-figma-maestro"
    role:        "Especialista em Design System e UX"
    model_hint:  "frontier"
    sub_agents: []
    description: |
      Arquiteto de interfaces, design tokens, micro-interações, consistência visual,
      componentes reutilizáveis e tradução de wireframes em especificações de UI.
