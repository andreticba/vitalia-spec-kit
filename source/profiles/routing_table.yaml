# routing_table.yaml | Vitalia SPEC Kit v0.0.1 | 08-11-2026 19:50(GMT-04:00)
# Mapa canônico: intenção do usuário → slash command Vitalia SPEC Kit
# Lido por: route.toml via guardian_context.py

schema_type: "routing_table"
schema_version: "0.0.1"

agents:
  # ── CICLO DE SESSÃO ──────────────────────────────────────────────────────────
  - id: "session-start"
    name: "Início de Sessão"
    command: "/vitalia-session-start"
    emoji: "🚀"
    gates: ["route"]
    priority: 1
    fallback: false
    patterns:
      - "iniciar sessão"
      - "começar"
      - "onde parei"
      - "cold start"
      - "retomar"
      - "abrir sessão"
      - "bom dia"
      - "vamos começar"
    description: "Recupera contexto completo e apresenta P0. Usar quando o usuário quer explicitamente iniciar ou retomar uma sessão."

  - id: "session-end"
    name: "Encerramento de Sessão"
    command: "/vitalia-session-end"
    emoji: "🏁"
    gates: ["route"]
    priority: 1
    patterns:
      - "encerrar sessão"
      - "finalizar"
      - "salvar e sair"
      - "commitar contexto"
      - "fechar o dia"
      - "terminar"
    description: "Reflexão, atualização 3-Tier, commit e shard."

  - id: "session-consolidate"
    name: "Consolidação"
    command: "/vitalia-session-consolidate"
    emoji: "🔄"
    gates: ["route"]
    priority: 2
    patterns:
      - "consolidar"
      - "sincronizar"
      - "push contexto"
      - "dashboard"
      - "atualizar readme"
      - "consolidar shards"
    description: "Consolida shards e renderiza README visual do contexto."

  # ── SDD PIPELINE PRINCIPAL ───────────────────────────────────────────────────
  - id: "brainstorming"
    name: "Brainstorming"
    command: "/vitalia-brainstorming"
    emoji: "🌀"
    gates: ["route"]
    priority: 1
    fallback: true
    patterns:
      - "brainstorming"
      - "explorar"
      - "pensar sobre"
      - "ideia"
      - "discutir"
      - "design thinking socrático"
      - "quero construir"
      - "como poderíamos"
    description: "Supervisor do ciclo SDD. Fallback padrão: intenção vaga ou sem match → brainstorming socrático."

  - id: "research"
    name: "Pesquisa e Grounding de Fronteira"
    command: "/vitalia-research"
    emoji: "🔬"
    gates: ["route", "brainstorming", "specify", "plan"]
    priority: 1
    fallback: false
    patterns:
      - "pesquisar documentação"
      - "grounding"
      - "verificar links"
      - "analisar contrato da ide"
      - "pesquisa externa"
      - "checar depreciação"
    description: "Pesquisa profunda via Sub-Agente com validação HTTP 200, leitura integral de páginas, verificação de depreciação e engenharia reversa funcional em 3 camadas."

  - id: "architect"
    name: "Regência Arquitetural Soberana"
    command: "/vitalia-architect"
    emoji: "🏛️"
    gates: ["route", "brainstorming"]
    priority: 1
    fallback: false
    patterns:
      - "architect"
      - "arquiteto"
      - "regência arquitetural"
      - "ADR"
      - "decisão arquitetural"
      - "transição brainstorming"
    description: "Converte consensos do brainstorming em governança arquitetural soberana, cria ADRs e prepara handoff para spec-specify."

  - id: "spec-specify"
    name: "Especificação"
    command: "/vitalia-spec-specify"
    emoji: "📋"
    gates: ["route"]
    priority: 2
    patterns:
      - "especificar"
      - "criar spec"
      - "escrever requisitos"
      - "feature spec"
      - "nova feature"
      - "spec-specify"
    description: "Traduz pedido em spec.md formal com FR-xxx, SC-xxx e Given/When/Then."

  - id: "spec-plan"
    name: "Plano Técnico"
    command: "/vitalia-spec-plan"
    emoji: "🗺️"
    gates: ["route"]
    priority: 2
    patterns:
      - "planejar"
      - "criar plano"
      - "arquitetura da feature"
      - "spec-plan"
      - "plan.md"
    description: "Lê spec aprovada e propõe arquitetura técnica com decisões documentadas."

  - id: "spec-tasks"
    name: "Tarefas"
    command: "/vitalia-spec-tasks"
    emoji: "✅"
    gates: ["route"]
    priority: 2
    patterns:
      - "criar tasks"
      - "quebrar em tarefas"
      - "spec-tasks"
      - "tasks.md"
      - "tarefas atômicas"
    description: "Converte plan.md aprovado em tasks.md com tarefas atômicas."

  - id: "spec-implement"
    name: "Implementação"
    command: "/vitalia-spec-implement"
    emoji: "⚙️"
    gates: ["route"]
    priority: 2
    patterns:
      - "implementar"
      - "codar"
      - "executar tasks"
      - "iniciar implementação"
      - "spec-implement"
    description: "Executa rigorosamente o tasks.md aprovado."

  - id: "task-verifier"
    name: "Verificador de Tarefas"
    command: "/vitalia-task-verifier"
    emoji: "🔍"
    gates: ["route"]
    priority: 2
    patterns:
      - "verificar tasks"
      - "checar constituição"
      - "task-verifier"
      - "compliance"
      - "validar tarefas"
    description: "Sub-agente que checa tasks.md contra a constitution antes da implementação."

  - id: "judge"
    name: "SDD Constitutional Judge"
    command: "/vitalia-judge"
    emoji: "⚖️"
    gates: ["route", "specify", "plan", "converge"]
    priority: 2
    patterns:
      - "judge"
      - "auditoria constitucional"
      - "inspeção adversarial"
      - "sdd-judge"
      - "auditar spec"
    description: "Auditoria constitucional adversarial nativa na IDE com Sanduíche Constitucional e aprovação HITL soberana."

  - id: "analyze"
    name: "Análise"
    command: "/vitalia-analyze"
    emoji: "🔬"
    gates: ["route"]
    priority: 2
    patterns:
      - "analisar"
      - "análise de consistência"
      - "verificar spec"
      - "gap análise"
    description: "Análise read-only de consistência entre spec.md, plan.md e tasks.md."

  - id: "clarify"
    name: "Clarificação"
    command: "/vitalia-clarify"
    emoji: "❓"
    gates: ["route"]
    priority: 2
    patterns:
      - "clarificar"
      - "ambiguidade"
      - "dúvida na spec"
      - "clarify"
    description: "Detecta e resolve ambiguidades no spec.md ativo."

  - id: "converge"
    name: "Convergência"
    command: "/vitalia-converge"
    emoji: "🎯"
    gates: ["route"]
    priority: 2
    patterns:
      - "converge"
      - "reconciliar"
      - "tasks desatualizadas"
      - "código vs spec"
    description: "Avalia código real contra spec/plan/tasks e reconcilia o tasks.md."

  - id: "route"
    name: "Roteador Semântico"
    command: "/vitalia-route"
    emoji: "🧭"
    gates: ["route"]
    priority: 3
    patterns:
      - "rotear"
      - "qual comando"
      - "route"
    description: "Roteamento inteligente de intenções do usuário com confirmação e handoff determinístico."
