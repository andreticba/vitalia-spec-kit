# gp_sdd-judge.yaml | Vitalia SPEC Kit v0.0.1 | 04-11-2026 20:30(GMT-04:00)
# Guardian Profile para o SDD-Judge Nativo na IDE Antigravity
# Ingestão Integral da Constituição sem truncamento e sem dependência de CLI legada.

schema_type: "guardian_profile"
schema_version: "0.0.1"
workflow: "sdd-judge"

judge_config:
  mode: "ide_subagent"
  zero_pruning: true
  inverted_cot: true
  hitl_sovereignty: true

phase_profiles:
  specify:
    description: "Gate na geração da spec.md — valida Requisitos Funcionais contra constituição integral"
    evaluation_unit: "FR"
    extraction_pattern: "^\\s*(?:#{1,4}\\s*)?-?\\s*\\*?\\*?FR-\\d+"
    principles_include: ["P00", "P01", "P02", "P03", "P07", "P09", "P14", "P17"]
    constitution_domains:
      - "PURPOSE"
      - "GOVERNANCE"
      - "GROUNDING"
      - "PRIVACY_DATA_VAULT"
      - "CLINICAL_SAFETY"
      - "REGULATORY_COMPLIANCE"

  plan:
    description: "Gate na aprovação do plan.md — valida Decisões Técnicas e ADRs"
    evaluation_unit: "ADR"
    extraction_pattern: "^##?#?\\s+(?:Decisao|Decisão|ADR)[:\\s]"
    principles_include: ["P01", "P03", "P04", "P06", "P11", "P15", "P16"]
    constitution_domains:
      - "GOVERNANCE"
      - "GROUNDING"
      - "INFRASTRUCTURE"
      - "SECRETS"
      - "HARDWARE_AGNOSTICISM"
      - "OBSERVABILITY"

  tasks:
    description: "Gate na geração do tasks.md — valida atomicidade e ordem das tarefas"
    evaluation_unit: "Task"
    extraction_pattern: "^\\s*(?:#{1,4}\\s*)?-?\\s*(?:\\[[ xX/]\\]\\s*)?T\\d+"
    principles_include: ["P00", "P01", "P05", "P06", "P09", "P12", "P13", "P14"]
    constitution_domains:
      - "PURPOSE"
      - "GOVERNANCE"
      - "SECRETS"
      - "AGENT_SECURITY"
      - "CLINICAL_SAFETY"

  converge:
    description: "Gate de convergência — valida se a implementação atende a spec e plan antes do merge"
    evaluation_unit: "Diff & Spec"
    principles_include: ["P00", "P01", "P02", "P03", "P04", "P05", "P06", "P07", "P08", "P09", "P10", "P11", "P12", "P13", "P14", "P15", "P16", "P17"]
    constitution_domains:
      - "PURPOSE"
      - "GOVERNANCE"
      - "GROUNDING"
      - "INFRASTRUCTURE"
      - "SECRETS"
      - "PRIVACY_DATA_VAULT"
      - "AGENT_SECURITY"
      - "CLINICAL_SAFETY"
      - "DIDACTIC_ENGINEERING"
      - "HARDWARE_AGNOSTICISM"
      - "OBSERVABILITY"
      - "REGULATORY_COMPLIANCE"
